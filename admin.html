<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ADMIN · [PC통신]</title>
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/admin.css">
  <script type="module" src="/admin.js"></script>
</head>
<body>
  <header class="site-header admin-site-header">
    <a class="brand" href="/" aria-label="PC통신 홈">
      <span class="brand-bracket">[</span><span class="brand-name">PC통신</span><span class="brand-bracket">]</span>
    </a>
    <span class="header-description">ADMIN</span>
    <nav class="desktop-nav" aria-label="관리 메뉴">
      <a href="/dashboard">통계</a>
      <a href="/">HOME</a>
    </nav>
  </header>

  <main class="admin-page shell">
    <section class="admin-hero">
      <div>
        <p class="micro-label">MEMBERSHIP / ADMIN</p>
        <h1>가입 신청 관리</h1>
      </div>
      <div class="admin-session">
        <span id="adminSessionLabel">SIGNED OUT</span>
        <button id="adminSignOut" class="admin-text-button" type="button" hidden>로그아웃</button>
      </div>
    </section>

    <section id="adminLogin" class="admin-login">
      <div>
        <p class="micro-label">ADMIN / LOGIN</p>
        <h2>운영진 로그인</h2>
      </div>
      <form id="adminLoginForm">
        <label for="adminEmail">이메일</label>
        <input id="adminEmail" type="email" autocomplete="email" required placeholder="admin@example.com">
        <label for="adminPassword">비밀번호</label>
        <input id="adminPassword" type="password" autocomplete="current-password" minlength="8" required placeholder="비밀번호">
        <div class="admin-login-row">
          <button class="button button-primary" type="submit">로그인</button>
          <button id="adminResetPassword" class="admin-reset-button" type="button">비밀번호 재설정</button>
        </div>
        <p id="adminLoginStatus" class="admin-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="adminApp" hidden>
      <div class="admin-summary" aria-label="가입 신청 요약">
        <article><span>TOTAL</span><b id="adminTotal">--</b></article>
        <article><span>PENDING</span><b id="adminPending">--</b></article>
        <article><span>APPROVED</span><b id="adminApproved">--</b></article>
        <article><span>REJECTED</span><b id="adminRejected">--</b></article>
      </div>

      <div class="admin-toolbar">
        <div class="admin-tabs" role="tablist" aria-label="신청 상태 필터">
          <button type="button" data-filter="pending" aria-selected="true">승인 대기</button>
          <button type="button" data-filter="approved">승인 완료</button>
          <button type="button" data-filter="rejected">반려</button>
          <button type="button" data-filter="all">전체</button>
        </div>
        <button id="adminRefresh" class="admin-text-button" type="button">새로고침</button>
      </div>

      <p id="adminAppStatus" class="admin-status" role="status" aria-live="polite"></p>
      <div id="adminRequestList" class="admin-request-list"></div>

      <section class="admin-project-section">
        <div class="admin-project-head">
          <div><p class="micro-label">PROJECTS / APPLICATIONS</p><h2>프로젝트 참여 신청</h2></div>
          <div class="admin-project-tabs">
            <button type="button" data-project-filter="pending" aria-selected="true">승인 대기</button>
            <button type="button" data-project-filter="approved">승인 완료</button>
            <button type="button" data-project-filter="rejected">반려</button>
            <button type="button" data-project-filter="all">전체</button>
          </div>
        </div>
        <p id="adminProjectStatus" class="admin-status" role="status" aria-live="polite"></p>
        <div id="adminProjectList" class="admin-request-list"></div>
      </section>

      <section class="admin-news-section">
        <div class="admin-project-head">
          <div><p class="micro-label">AI NEWS / PUBLISH</p><h2>AI 소식 관리</h2></div>
        </div>
        <form id="adminNewsForm" class="admin-archive-form">
          <label>출처<input id="newsSource" type="text" maxlength="80" required placeholder="예: OPENAI / CHATGPT"></label>
          <label>게시일<input id="newsPublishedAt" type="date" required></label>
          <label class="admin-archive-wide">제목<input id="newsTitle" type="text" maxlength="180" required></label>
          <label class="admin-archive-wide">요약<textarea id="newsSummary" rows="3" maxlength="600"></textarea></label>
          <label class="admin-archive-wide">원문 URL<input id="newsSourceUrl" type="url" required placeholder="https://"></label>
          <label class="admin-archive-wide">대표 이미지 URL<input id="newsImageUrl" type="url" placeholder="https://"></label>
          <label class="admin-checkbox-row"><input id="newsFeatured" type="checkbox"> 대표 기사로 표시</label>
          <label class="admin-checkbox-row"><input id="newsPublished" type="checkbox" checked> 게시</label>
          <div class="admin-archive-actions">
            <button class="button button-primary" type="submit">소식 등록</button>
            <span id="adminNewsStatus" class="admin-status" role="status" aria-live="polite"></span>
          </div>
        </form>
        <div id="adminNewsList" class="admin-request-list"></div>
      </section>

      <section class="admin-archive-section">
        <div class="admin-project-head">
          <div><p class="micro-label">ARCHIVE / UPLOAD</p><h2>회원 자료 업로드</h2></div>
        </div>
        <form id="adminArchiveForm" class="admin-archive-form">
          <label>제목<input id="archiveTitle" type="text" maxlength="120" required></label>
          <label>카테고리
            <select id="archiveCategory" required>
              <option value="start">AI 시작하기</option>
              <option value="work">업무 활용</option>
              <option value="automate">자동화</option>
              <option value="build">만들기</option>
              <option value="learn">교육자료</option>
              <option value="club">PC통신 자료</option>
            </select>
          </label>
          <label class="admin-archive-wide">설명<textarea id="archiveDescription" rows="3" maxlength="500"></textarea></label>
          <label class="admin-archive-wide">파일<input id="archiveFile" type="file" required></label>
          <div class="admin-archive-actions">
            <button class="button button-primary" type="submit">자료 업로드</button>
            <span id="adminArchiveStatus" class="admin-status" role="status" aria-live="polite"></span>
          </div>
        </form>
        <div id="adminArchiveList" class="admin-request-list"></div>
      </section>
    </section>
  </main>
</body>
</html>
