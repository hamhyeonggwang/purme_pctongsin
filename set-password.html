<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>비밀번호 설정 · [PC통신]</title>
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/member.css">
  <script type="module" src="/set-password.js"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/"><span class="brand-bracket">[</span><span class="brand-name">PC통신</span><span class="brand-bracket">]</span></a>
  <span class="header-description">SET PASSWORD</span>
  <nav class="desktop-nav"><a href="/">HOME</a><a href="/login">LOGIN</a></nav>
</header>
<main class="member-page shell">
  <section class="member-login-card">
    <div>
      <p class="micro-label">ACCOUNT / PASSWORD</p>
      <h1>비밀번호 설정</h1>
    </div>
    <form id="passwordForm">
      <label for="newPassword">새 비밀번호</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="8자 이상">
      <label for="confirmPassword">비밀번호 확인</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="같은 비밀번호 입력">
      <button class="button button-primary" type="submit">비밀번호 저장</button>
      <p id="passwordStatus" class="member-status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
</body>
</html>
